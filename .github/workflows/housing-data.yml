name: 更新雙北房價資料

# 內政部實價登錄每月 1、11、21 日發布新的一期。每天早上檢查一次：
# 本期資料有變才重算，結果存到 housing-data 分支，再觸發網站部署。
on:
  schedule:
    - cron: '30 0 * * *'   # 每天台北時間 08:30
  workflow_dispatch:
    inputs:
      force:
        description: 資料沒變也重新計算
        type: boolean
        default: false

permissions:
  contents: write   # 推送 housing-data 分支
  actions: write    # 觸發部署

concurrency:
  group: housing-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r scripts/housing/requirements.txt

      # 已下載的季資料、各期資料留在快取裡，下次只要下載新的部分
      - uses: actions/cache@v4
        with:
          path: .housing-cache
          key: housing-cache-${{ github.run_id }}
          restore-keys: housing-cache-

      - name: 取出上次的結果
        run: |
          mkdir -p housing-out
          if git fetch --depth 1 origin housing-data; then git archive FETCH_HEAD | tar -x -C housing-out; fi

      - name: 下載並計算
        id: build
        run: |
          python scripts/housing/update.py .housing-cache housing-out ${{ inputs.force && '--force' || '' }} | tee result.txt
          echo "result=$(tail -1 result.txt)" >> "$GITHUB_OUTPUT"

      - name: 存到 housing-data 分支
        if: steps.build.outputs.result == 'UPDATED'
        working-directory: housing-out
        run: |
          git init -q -b housing-data
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -qm "雙北房價資料 $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" housing-data

      - name: 部署網站
        if: steps.build.outputs.result == 'UPDATED'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
